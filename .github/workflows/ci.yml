name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so that bit rot in the implementations, in Quicklisp or in
    # the runner images is noticed even when nothing is being pushed.
    - cron: '17 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.lisp }} on ${{ matrix.os }}${{ matrix.deps == 'git' && ' (deps from git)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # Roswell on Windows lives inside MSYS2 and has to be driven from
        # its shell.  Everywhere else this is exactly the shell GitHub
        # would have used anyway -- spelling it "bash" instead would add
        # --noprofile --norc -o pipefail and change how the steps behave.
        shell: ${{ matrix.shell || 'bash -e {0}' }}
    strategy:
      fail-fast: false
      matrix:
        # Every row here is required: there is nothing left that is
        # expected to fail, so a failure is news.
        include:
          - { os: ubuntu-latest, lisp: sbcl-bin }
          - { os: ubuntu-latest, lisp: ccl }
          - { os: ubuntu-latest, lisp: ecl }
          - { os: ubuntu-latest, lisp: abcl }
          # "clisp-head", not "clisp": the latter has Roswell build CLISP
          # from source, and 2.49 -- from 2010 -- is still the last
          # release, which today's GCC cannot compile ("stdbool.h: No such
          # file or directory" while generating clisp.h, then a cascade of
          # unknown types in modules.c).  clisp-head downloads a prebuilt
          # binary of a current CLISP instead, so there is nothing to
          # compile; Roswell picks the glibc2.19 variant on Linux, which
          # needs no symbol newer than GLIBC_2.15 and links libffcall and
          # libsigsegv statically.
          - { os: ubuntu-latest, lisp: clisp-head }
          # Both of these are pinned to work around Roswell bugs: left to
          # itself it picks a version whose download is gone.  It defaults
          # to Allegro 10.1express, which Franz no longer serves -- fixed
          # in Roswell 9709c0d, but that postdates the v26.02.116 release
          # that install-for-ci.sh installs.  And it defaults to the
          # newest CMUCL while its installer only knows how to fetch
          # .tar.bz2, which CMUCL stopped publishing after 21e.  Drop both
          # pins once a Roswell release carries the fixes.
          - { os: ubuntu-latest, lisp: allegro/11.0express }
          - { os: ubuntu-latest, lisp: cmu-bin/21e, multilib: true }
          - { os: macos-latest, lisp: sbcl-bin }
          # The macos-latest runners are arm64, where Roswell cannot
          # install CCL, so the "Install CCL ... for arm64 macOS" step
          # below does it and this row runs the result as a system CCL.
          # Hence the pinned version: that step builds the download URL
          # itself, so it cannot ask Roswell what the newest CCL is.
          - { os: macos-latest, lisp: ccl-bin/system, ccl_arm64: '1.14' }
          - { os: windows-latest, lisp: sbcl-bin, shell: 'msys2 {0}' }
          # Tracks the development versions of the libraries CFFI is
          # developed alongside, as the Travis setup used to.
          - { os: ubuntu-latest, lisp: sbcl-bin, deps: git }
    env:
      # Read by scripts/install-for-ci.sh to pick the implementation.
      LISP: ${{ matrix.lisp }}
    steps:
      - uses: actions/checkout@v7

      # Brings its own gcc, libffi and pkg-config, so the Linux step below
      # has no Windows counterpart.
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          # MINGW64 is deprecated in favour of UCRT64, which links the
          # Universal CRT instead of the ancient msvcrt.dll.
          msystem: UCRT64
          # Roswell shells out to what it finds on PATH, so let it see the
          # runner's tools as well as MSYS2's.
          path-type: inherit
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libffi
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-roswell

      - name: Install C dependencies
        if: runner.os == 'Linux'
        run: |
          # CMUCL is 32-bit x86, so it builds the test libraries with -m32
          # and needs an i386 libffi for cffi-libffi.
          if [ "${{ matrix.multilib }}" = true ]; then
            sudo dpkg --add-architecture i386
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libffi-dev pkg-config
          if [ "${{ matrix.multilib }}" = true ]; then
            sudo apt-get install -y --no-install-recommends gcc-multilib libffi-dev:i386
          fi
        # macOS: ffi.h comes with the SDK and libffi.dylib with the system.

      - name: Compute cache key
        id: cache-key
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache Roswell and Quicklisp
        uses: actions/cache@v6
        with:
          path: ~/.roswell
          key: roswell-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lisp }}-${{ steps.cache-key.outputs.month }}
          restore-keys: roswell-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lisp }}-

      # The flakiest part of the build: `ros use` fails outright if a
      # restored cache doesn't hold the version Roswell now resolves to,
      # and the version listings it fetches are not always reachable.
      # Neither is worth a red build, so try once more from scratch.
      - name: Install Roswell and ${{ matrix.lisp }}
        id: roswell
        continue-on-error: true
        env:
          # On the arm64 macOS row let the script set up Roswell, Quicklisp
          # and the ASDF source registry with its sbcl-bin default -- which
          # it needs anyway, since `ros install` and `ros setup` themselves
          # run on sbcl-bin -- and leave CCL to the step after it.
          LISP: ${{ matrix.ccl_arm64 && 'sbcl-bin' || matrix.lisp }}
        run: curl -fsSL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh

      - name: Install Roswell and ${{ matrix.lisp }} (retry, without the cache)
        if: steps.roswell.outcome == 'failure'
        env:
          LISP: ${{ matrix.ccl_arm64 && 'sbcl-bin' || matrix.lisp }}
        run: |
          rm -rf ~/.roswell
          curl -fsSL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh

      # Roswell refuses to install ccl-bin on an arm64 host: install-ccl-bin.lisp
      # bails out with "Not supported platform arm64".  That guard dates from
      # 2017 and was aimed at aarch64 Linux, which had no CCL build then, but
      # it keys off uname -m alone, so macOS arm64 trips it too; it is still
      # there in v26.10.119, the release install-for-ci.sh installs.  There is
      # a build to install now -- CCL 1.14 (2026-10-28) ships darwinarm64, and
      # roswell/ccl_bin mirrors it -- so fetch it and let Roswell run it as a
      # system CCL.  That is also the one arm64-clean path through Roswell's
      # cmd-run-ccl.c: for a managed version it derives the kernel name from
      # uname -m and would look for "dcl" rather than "darm64cl".  CCL's own
      # scripts/ccl doesn't know darwin arm64 either, hence the wrapper.
      # Replace all of this with a plain matrix row once Roswell installs
      # ccl-bin on arm64 itself.
      - name: Install CCL ${{ matrix.ccl_arm64 }} for arm64 macOS
        if: matrix.ccl_arm64
        run: |
          version='${{ matrix.ccl_arm64 }}'
          mkdir -p "$HOME/ccl" "$HOME/bin"
          curl -fsSL --retry 3 \
            "https://github.com/roswell/ccl_bin/releases/download/$version/ccl-$version-darwinarm64.tar.gz" \
            | tar -xz -C "$HOME/ccl" --strip-components=1
          printf '#!/bin/sh\nexec "%s/darm64cl" "$@"\n' "$HOME/ccl" > "$HOME/bin/ccl"
          chmod +x "$HOME/bin/ccl"
          # GITHUB_PATH only takes effect in later steps, so `ros use` --
          # which validates the choice by running `ccl --version` -- needs
          # the directory on PATH here as well.
          echo "$HOME/bin" >> "$GITHUB_PATH"
          PATH="$HOME/bin:$PATH" ros use "$LISP"

      # install-for-ci.sh puts both $GITHUB_WORKSPACE and ~/lisp in ASDF's
      # source registry, so anything cloned here shadows the Quicklisp dist.
      - name: Use development versions of CFFI's dependencies
        if: matrix.deps == 'git'
        run: |
          git clone --depth=1 https://github.com/trivial-features/trivial-features.git ~/lisp/trivial-features
          git clone --depth=1 https://github.com/cl-babel/babel.git ~/lisp/babel
          git clone --depth=1 https://gitlab.common-lisp.net/alexandria/alexandria.git ~/lisp/alexandria

      # MISC-TYPES.SIZEOF.{PTRDIFF,SIZE,OFFSET} fail with the dist's
      # trivial-features, which reports :32-BIT on a 64-bit JVM.  Fixed by
      # trivial-features#27, merged but not in any Quicklisp dist yet
      # (there has been none since 2026-01-01).  Drop this step once one
      # ships, so that ABCL is tested against the same code users get --
      # and expect those three tests to fail again until it does.
      - name: Use trivial-features from git
        if: matrix.lisp == 'abcl'
        run: |
          git clone --depth=1 https://github.com/trivial-features/trivial-features.git ~/lisp/trivial-features

      - name: Run the test suite
        run: |
          extra=()
          if [ "$LISP" = abcl ]; then
            # CFFI's ABCL backend needs JNA, which neither the ABCL
            # distribution nor Roswell ships, and ABCL's own (require :jna)
            # only works where Maven can resolve it.
            curl -fsSL --retry 3 -o "$HOME/jna.jar" \
              https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.14.0/jna-5.14.0.jar
            extra=(-e "(java:add-to-classpath \"$HOME/jna.jar\")")
          fi
          # cffi-tests.asd loads trivial-features while it is being read, so
          # the dependencies have to be there before cffi-tests is quickloaded.
          # Without a debugger hook an error during loading drops into the
          # debugger, reads EOF and exits 0 -- a green job that ran no tests.
          ros "${extra[@]}" \
              -e '(setf *debugger-hook*
                        (lambda (condition hook)
                          (declare (ignore hook))
                          (format *error-output* "~&Unhandled ~a:~%  ~a~%"
                                  (type-of condition) condition)
                          (uiop:quit 3)))' \
              -e '(ql:quickload (list "trivial-features" "babel" "rt"))' \
              -e '(ql:quickload "cffi-tests")' \
              -e '(uiop:quit (if (cffi-tests:run-all-cffi-tests) 1 0))'
